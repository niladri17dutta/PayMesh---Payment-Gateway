name: 💬 ReviewGround Interactive PR Slash Commands

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: reviewground-slash-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  slash-command:
    name: 💬 ReviewGround Slash Command Handler
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request != null &&
      github.actor != 'dependabot[bot]' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, '@reviewground') ||
       contains(github.event.comment.body, '/review') ||
       contains(github.event.comment.body, '@review'))

    steps:
      - name: Run ReviewGround Slash Command
        uses: arungupta1526/reviewground@4840f45c6442ae5b7ff3af7a17cfa0b6812c66f0 # post-v1.5.0 (4840f45)
        with:
          mode: 'slash-command'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PROVIDER: ${{ vars.PROVIDER || '' }}
          MODEL: ${{ vars.MODEL || '' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
