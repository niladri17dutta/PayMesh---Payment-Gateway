name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'apps/android-observer-app/**'
      - 'scripts/build-android-apk.js'
      - 'scripts/sync-android-allowlist.js'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/android-observer-app/**'
      - 'scripts/build-android-apk.js'
      - 'scripts/sync-android-allowlist.js'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile & Verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17.0.13'

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Certified Android APK
        run: npm run build:android:apk

      - name: Verify APK Checksum
        # Verifies that the APK and the .sha256 file uploaded together describe the same
        # bytes, so a corrupted or mismatched artifact pair cannot be published. It is not
        # an attestation against the checksum committed to the repository: the build signs
        # with a throwaway key, so the produced APK differs on every run.
        run: |
          set -euo pipefail
          cd apps/android-observer-app
          sha256sum -c youpi-sms-gateway.apk.sha256

      - name: Verify Android Observer Tests
        env:
          NODE_ENV: test
          YOUPI_MODE: localhost
        run: node --test apps/android-observer-app/__tests__/android-observer.test.js

      - name: Upload Android APK & Checksum Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: youpi-sms-gateway-apk
          path: |
            apps/android-observer-app/youpi-sms-gateway.apk
            apps/android-observer-app/youpi-sms-gateway.apk.sha256
          if-no-files-found: error
          retention-days: 14
